const EASE = [0.22, 1, 0.36, 1];

function Reveal({ children, delay = 0, y = 40, once = true, className = "" }) {
  return (
    <motion.div
      className={className}
      initial={{ opacity: 0, y: REDUCED ? 0 : y }}
      whileInView={{ opacity: 1, y: 0 }}
      viewport={{ once, margin: "-80px" }}
      transition={{ duration: 0.9, delay, ease: EASE }}
    >
      {children}
    </motion.div>
  );
}

function TextReveal({ text, className = "", delay = 0, stagger = 0.035 }) {
  const words = text.split(" ");
  return (
    <span className={className} style={{ display: "inline-block" }}>
      {words.map((w, i) => (
        <span key={i} style={{ display: "inline-block", overflow: "hidden", verticalAlign: "top" }}>
          <motion.span
            style={{ display: "inline-block" }}
            initial={{ y: "110%" }}
            whileInView={{ y: 0 }}
            viewport={{ once: true, margin: "-60px" }}
            transition={{ duration: 0.85, delay: delay + i * stagger, ease: EASE }}
          >
            {w}&nbsp;
          </motion.span>
        </span>
      ))}
    </span>
  );
}

function Magnetic({ children, strength = 0.35, className = "" }) {
  const ref = useRef(null);
  const x = useMotionValue(0);
  const y = useMotionValue(0);
  const sx = useSpring(x, { stiffness: 180, damping: 14 });
  const sy = useSpring(y, { stiffness: 180, damping: 14 });
  const onMove = (e) => {
    if (!FINE_POINTER || REDUCED) return;
    const r = ref.current.getBoundingClientRect();
    x.set((e.clientX - (r.left + r.width / 2)) * strength);
    y.set((e.clientY - (r.top + r.height / 2)) * strength);
  };
  const onLeave = () => { x.set(0); y.set(0); };
  return (
    <motion.div ref={ref} className={className} style={{ x: sx, y: sy, display: "inline-block" }}
      onMouseMove={onMove} onMouseLeave={onLeave}>
      {children}
    </motion.div>
  );
}

function SectionHead({ index, label, title, accent }) {

}

function Cursor() {
  const [enabled, setEnabled] = useState(FINE_POINTER);
  const [label, setLabel] = useState("");
  const x = useMotionValue(-100); const y = useMotionValue(-100);
  const sx = useSpring(x, { stiffness: 500, damping: 40, mass: 0.6 });
  const sy = useSpring(y, { stiffness: 500, damping: 40, mass: 0.6 });
  const rx = useSpring(x, { stiffness: 120, damping: 20 });
  const ry = useSpring(y, { stiffness: 120, damping: 20 });

  useEffect(() => {
    if (!enabled) return;
    const move = (e) => { x.set(e.clientX); y.set(e.clientY); };
    const over = (e) => {
      const t = e.target.closest("[data-cursor]");
      setLabel(t ? t.getAttribute("data-cursor") : "");
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseover", over);
    return () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseover", over); };
  }, [enabled]);

  if (!enabled) return null;
  const big = label !== "";
  return (
    <React.Fragment>
      <motion.div style={{ x: sx, y: sy, position: "fixed", top: 0, left: 0, zIndex: 9999, pointerEvents: "none" }}>
        <div style={{ width: 8, height: 8, borderRadius: 99, background: "#c8f542", transform: "translate(-50%,-50%)" }} />
      </motion.div>
      <motion.div style={{ x: rx, y: ry, position: "fixed", top: 0, left: 0, zIndex: 9998, pointerEvents: "none" }}>
        <motion.div
          animate={{ width: big ? 84 : 36, height: big ? 84 : 36, backgroundColor: big ? "rgba(200,245,66,0.95)" : "rgba(200,245,66,0)" }}
          transition={{ duration: 0.3, ease: EASE }}
          style={{ borderRadius: 99, border: "1px solid rgba(200,245,66,0.6)", transform: "translate(-50%,-50%)", display: "flex", alignItems: "center", justifyContent: "center" }}
        >
          {big && <span style={{ fontSize: 10, letterSpacing: "0.15em", color: "#07070c", fontWeight: 600, fontFamily: "'Space Grotesk',sans-serif" }}>{label}</span>}
        </motion.div>
      </motion.div>
    </React.Fragment>
  );
}

function Projects({ lenisRef }) {
  const [filter, setFilter] = useState("all");

  const listRef = useRef(null);
  const mx = useMotionValue(0); const my = useMotionValue(0);
  const sx = useSpring(mx, { stiffness: 160, damping: 22 });
  const sy = useSpring(my, { stiffness: 160, damping: 22 });
  const [hovered, setHovered] = useState(null);

  const visible = PROJECTS.filter((p) => filter === "all" || p.categories.includes(filter));

  const onMove = (e) => {
    const r = listRef.current.getBoundingClientRect();
    mx.set(e.clientX - r.left); my.set(e.clientY - r.top);
  };

  useEffect(() => {
    if (active && lenisRef.current) lenisRef.current.stop();
    else if (lenisRef.current) lenisRef.current.start();
    const onKey = (e) => { if (e.key === "Escape") setActive(null); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [active]);

  return (
    <section id="work" className="relative py-28 md:py-40">
      <div className="px-6 md:px-12 lg:px-20 max-w-[1400px] mx-auto">

/* PRELOADER                                                           */
/* ------------------------------------------------------------------ */
function Preloader() {
  const [n, setN] = useState(0);
  const [done, setDone] = useState(false);
  useEffect(() => {
    if (REDUCED) { setDone(true); return; }
    const start = performance.now();
    const dur = 1400;
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - start) / dur);
      setN(Math.round(p * 100));
      if (p < 1) raf = requestAnimationFrame(tick);
      else setTimeout(() => setDone(true), 250);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);
  return (
    <AnimatePresence>
      {!done && (
        <motion.div exit={{ y: "-100%" }} transition={{ duration: 0.9, ease: EASE }}
          className="fixed inset-0 z-[100] bg-ink flex flex-col items-center justify-center">
          <p className="font-grotesk font-semibold text-4xl md:text-6xl tracking-tight">pp<span className="text-lime">.</span></p>
          <div className="mt-8 w-56 h-px bg-white/10 relative overflow-hidden">
            <motion.div className="absolute inset-y-0 left-0 bg-lime" style={{ width: n + "%" }} />
          </div>
          <p className="mt-4 font-mono text-xs text-white/40 tracking-[0.3em]">{n}%</p>
        </motion.div>
      )}
    </AnimatePresence>
  );
}

function App() {
  const lenisRef = useRef(null);
  useEffect(() => {
    if (REDUCED) return;
    const lenis = new Lenis({ duration: 1.15, smoothWheel: true });
    lenisRef.current = lenis;
    let raf;
    const loop = (t) => { lenis.raf(t); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
    return () => { cancelAnimationFrame(raf); lenis.destroy(); lenisRef.current = null; };
  }, []);

  return (
    <React.Fragment>
      <Preloader />
      <Cursor />
      <Navbar lenisRef={lenisRef} />
      <main>
        <Hero lenisRef={lenisRef} />

    </React.Fragment>
  );
}
