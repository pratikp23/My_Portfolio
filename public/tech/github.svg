<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="cardGlow_github" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#F8FAFC" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0c1017" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardBg_github" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080b0f" />
    </linearGradient>
    <linearGradient id="borderGrad_github" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.25" />
    </linearGradient>
    <filter id="shadow_github" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#F8FAFC" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="580" height="730" rx="32" ry="32" fill="url(#cardBg_github)" stroke="url(#borderGrad_github)" stroke-width="2" />
  
  <!-- Ambient Radial Glow -->
  <circle cx="300" cy="270" r="230" fill="url(#cardGlow_github)" />

  <!-- Corner Tech Accent Marks -->
  <path d="M 28 56 L 28 28 L 56 28" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 572 56 L 572 28 L 544 28" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 28 694 L 28 722 L 56 722" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 572 694 L 572 722 L 544 722" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" opacity="0.85" />

  <!-- Center Logo Container -->
