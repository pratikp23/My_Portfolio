<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="cardGlow_nextjs" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0c1017" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardBg_nextjs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080b0f" />
    </linearGradient>
    <linearGradient id="borderGrad_nextjs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25" />
    </linearGradient>
    <filter id="shadow_nextjs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="580" height="730" rx="32" ry="32" fill="url(#cardBg_nextjs)" stroke="url(#borderGrad_nextjs)" stroke-width="2" />
  
  <!-- Ambient Radial Glow -->
  <circle cx="300" cy="270" r="230" fill="url(#cardGlow_nextjs)" />

  <!-- Corner Tech Accent Marks -->
  <path d="M 28 56 L 28 28 L 56 28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 572 56 L 572 28 L 544 28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 28 694 L 28 722 L 56 722" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 572 694 L 572 722 L 544 722" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" />

  <!-- Center Logo Container -->
  <g filter="url(#shadow_nextjs)">
    
      <defs>
        <linearGradient id="nextSlash" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.7" />
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </linearGradient>
      </defs>
      <circle cx="300" cy="270" r="105" fill="#000000" stroke="#334155" stroke-width="4" />
      <g transform="translate(195, 165) scale(1.17)">
        <path d="M149.5 157.5L69.1 54H54v72h14v-53.7l70.8 91.4c3.8-1.8 7.4-3.9 10.7-6.2z" fill="url(#nextSlash)" />
        <rect x="115" y="54" width="14" height="72" fill="#FFFFFF" />
      </g>
    
  </g>

  <!-- Tech Name -->
  <text x="300" y="490" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">
    Next.js
  </text>

  <!-- Category Pill Badge -->
  <g transform="translate(300, 555)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" ry="22" fill="#0f172a" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      FULL STACK FRAMEWORK
    </text>
  </g>

  <!-- Bottom Terminal Tag -->
  <text x="300" y="665" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="15" font-weight="500" fill="#64748B" letter-spacing="2">
    // CORE SYSTEM STACK
  </text>
</svg>