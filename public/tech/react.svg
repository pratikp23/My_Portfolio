<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="cardGlow_react" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#61DAFB" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0c1017" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardBg_react" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080b0f" />
    </linearGradient>
    <linearGradient id="borderGrad_react" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#61DAFB" stop-opacity="0.25" />
    </linearGradient>
    <filter id="shadow_react" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#61DAFB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="580" height="730" rx="32" ry="32" fill="url(#cardBg_react)" stroke="url(#borderGrad_react)" stroke-width="2" />
  
  <!-- Ambient Radial Glow -->
  <circle cx="300" cy="270" r="230" fill="url(#cardGlow_react)" />

  <!-- Corner Tech Accent Marks -->
  <path d="M 28 56 L 28 28 L 56 28" fill="none" stroke="#61DAFB" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 572 56 L 572 28 L 544 28" fill="none" stroke="#61DAFB" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 28 694 L 28 722 L 56 722" fill="none" stroke="#61DAFB" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 572 694 L 572 722 L 544 722" fill="none" stroke="#61DAFB" stroke-width="3" stroke-linecap="round" opacity="0.85" />

  <!-- Center Logo Container -->
  <g filter="url(#shadow_react)">
    
      <g stroke="#61DAFB" stroke-width="12" fill="none">
        <ellipse cx="300" cy="270" rx="118" ry="44" />
        <ellipse cx="300" cy="270" rx="118" ry="44" transform="rotate(60 300 270)" />
        <ellipse cx="300" cy="270" rx="118" ry="44" transform="rotate(120 300 270)" />
      </g>
      <circle cx="300" cy="270" r="22" fill="#61DAFB" />
    
  </g>

  <!-- Tech Name -->
  <text x="300" y="490" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">
    React.js
  </text>

  <!-- Category Pill Badge -->
  <g transform="translate(300, 555)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" ry="22" fill="#0f172a" stroke="#61DAFB" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#61DAFB" letter-spacing="1.5">
      FRONTEND ARCHITECTURE
    </text>
  </g>

  <!-- Bottom Terminal Tag -->
  <text x="300" y="665" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="15" font-weight="500" fill="#64748B" letter-spacing="2">
    // CORE SYSTEM STACK
  </text>
</svg>