<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="cardGlow_postgresql" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#336791" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#336791" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0c1017" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardBg_postgresql" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080b0f" />
    </linearGradient>
    <linearGradient id="borderGrad_postgresql" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.25" />
    </linearGradient>
    <filter id="shadow_postgresql" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38BDF8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="580" height="730" rx="32" ry="32" fill="url(#cardBg_postgresql)" stroke="url(#borderGrad_postgresql)" stroke-width="2" />
  
  <!-- Ambient Radial Glow -->
  <circle cx="300" cy="270" r="230" fill="url(#cardGlow_postgresql)" />

  <!-- Corner Tech Accent Marks -->
  <path d="M 28 56 L 28 28 L 56 28" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 572 56 L 572 28 L 544 28" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 28 694 L 28 722 L 56 722" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 572 694 L 572 722 L 544 722" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.85" />

  <!-- Center Logo Container -->
  <g filter="url(#shadow_postgresql)">
    
      <g transform="translate(300, 260) scale(1.2)">
        <!-- Elephant Head Silhouette / Slonik -->
        <path d="M -70 10 C -70 -60 50 -75 75 -20 C 85 5 80 45 60 70 C 45 88 15 90 0 90 C -20 90 -40 75 -55 55 C -65 40 -70 25 -70 10 Z" fill="#336791" />
        <!-- Elephant Ear -->
        <path d="M -75 5 C -90 -30 -60 -70 -25 -70 C -40 -40 -45 10 -75 5 Z" fill="#29557a" />
        <!-- Trunk -->
        <path d="M 60 40 C 75 55 90 80 85 100 C 80 115 65 115 55 105 C 45 95 55 75 45 60 Z" fill="#336791" />
        <!-- Eye -->
        <circle cx="20" cy="-20" r="8" fill="#FFFFFF" />
        <circle cx="22" cy="-20" r="4" fill="#0D1117" />
        <!-- Tusk -->
        <path d="M 35 55 C 45 65 60 65 65 50 C 50 48 40 45 35 55 Z" fill="#FFFFFF" />
      </g>
    
  </g>

  <!-- Tech Name -->
  <text x="300" y="490" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">
    PostgreSQL
  </text>

  <!-- Category Pill Badge -->
  <g transform="translate(300, 555)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" ry="22" fill="#0f172a" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38BDF8" letter-spacing="1.5">
      RELATIONAL DATABASE
    </text>
  </g>

  <!-- Bottom Terminal Tag -->
  <text x="300" y="665" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="15" font-weight="500" fill="#64748B" letter-spacing="2">
    // CORE SYSTEM STACK
  </text>
</svg>