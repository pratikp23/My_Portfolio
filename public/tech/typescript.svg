<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="cardGlow_typescript" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#3178C6" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#3178C6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0c1017" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardBg_typescript" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080b0f" />
    </linearGradient>
    <linearGradient id="borderGrad_typescript" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3178C6" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3178C6" stop-opacity="0.25" />
    </linearGradient>
    <filter id="shadow_typescript" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3178C6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="580" height="730" rx="32" ry="32" fill="url(#cardBg_typescript)" stroke="url(#borderGrad_typescript)" stroke-width="2" />
  
  <!-- Ambient Radial Glow -->
  <circle cx="300" cy="270" r="230" fill="url(#cardGlow_typescript)" />

  <!-- Corner Tech Accent Marks -->
  <path d="M 28 56 L 28 28 L 56 28" fill="none" stroke="#3178C6" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 572 56 L 572 28 L 544 28" fill="none" stroke="#3178C6" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 28 694 L 28 722 L 56 722" fill="none" stroke="#3178C6" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 572 694 L 572 722 L 544 722" fill="none" stroke="#3178C6" stroke-width="3" stroke-linecap="round" opacity="0.85" />

  <!-- Center Logo Container -->
  <g filter="url(#shadow_typescript)">
    
      <rect x="195" y="165" width="210" height="210" rx="28" fill="#3178C6" />
      <!-- Letter T -->
      <path d="M 230 226 H 290 V 244 H 269 V 328 H 251 V 244 H 230 Z" fill="#FFFFFF" />
      <!-- Letter S -->
      <path d="M 305 304 C 310 322 325 330 344 330 C 362 330 374 320 374 308 C 374 295 363 288 347 283 L 335 279 C 316 273 302 263 302 245 C 302 225 320 212 342 212 C 364 212 379 224 382 242 L 364 246 C 361 234 353 228 342 228 C 331 228 322 235 322 244 C 322 254 331 259 344 263 L 356 267 C 378 274 394 285 394 308 C 394 330 374 346 344 346 C 318 346 300 331 296 306 Z" fill="#FFFFFF" />
    
  </g>

  <!-- Tech Name -->
  <text x="300" y="490" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">
    TypeScript
  </text>

  <!-- Category Pill Badge -->
  <g transform="translate(300, 555)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" ry="22" fill="#0f172a" stroke="#3178C6" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#3178C6" letter-spacing="1.5">
      TYPE-SAFE SYSTEMS
    </text>
  </g>

  <!-- Bottom Terminal Tag -->
  <text x="300" y="665" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="15" font-weight="500" fill="#64748B" letter-spacing="2">
    // CORE SYSTEM STACK
  </text>
</svg>